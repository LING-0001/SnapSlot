name: Verify SnapSlot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    env:
      SNAPSLOT_SOURCE_CHECK_ONLY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci --prefix apps/website
      - run: node --test scripts/tests/*.test.mjs
      - run: npm run test:downloads --prefix apps/website
      - run: npm run build --prefix apps/website
      - run: npm run build:native --prefix apps/website
      - run: npx --prefix apps/website playwright install --with-deps chromium
      - run: npm test --prefix apps/website
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci --prefix apps/website
      - run: npm run build:native --prefix apps/website
      - run: dotnet run --project apps/windows/Checks/SnapSlot.Windows.Checks.csproj
      - run: dotnet build apps/windows/SnapSlot.Windows.csproj -c Debug
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift run --package-path apps/macos SnapSlotCoreChecks
      - run: bash scripts/check-macos-hotkeys.sh
      - run: swift build --package-path apps/macos --product SnapSlot
