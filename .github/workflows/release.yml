name: Publish release
on:
  push:
    branches:
      - release
      - 'releasev*'
      - 'release/v*'
permissions:
  contents: read
env:
  SNAPSLOT_REQUIRE_MAC_NOTARIZATION: '1'
concurrency:
  # Serialize all release branches; main development never cancels a release.
  group: snapslot-release
  cancel-in-progress: false
jobs:
  authorize:
    if: github.repository == 'LING-0001/SnapSlot' && github.actor == 'LING-0001' && github.triggering_actor == 'LING-0001'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        name: Check owner, main ancestry, version and existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs

  package:
    needs: authorize
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import Developer ID and validate Apple notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/setup-macos-signing.sh
      - run: npm ci --prefix apps/website
      - name: Install packaging tools on the GitHub runner
        run: |
          brew install makensis sevenzip
          python -m venv .tools/dmgbuild
          .tools/dmgbuild/bin/pip install dmgbuild==1.6.7
      - name: Build universal Mac DMG and Windows x64 installer from this commit
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/prepare-release.mjs
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-installers
          path: apps/website/public/downloads/v${{ needs.authorize.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary signing keychain
        if: always()
        run: bash scripts/cleanup-macos-signing.sh

  verify-windows-installer:
    needs: [authorize, package]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-installers
          path: apps/website/public/downloads/v${{ needs.authorize.outputs.version }}/
      - name: Verify Microsoft signature, install, native UI and uninstall
        run: ./scripts/installers/check-windows.ps1
        shell: pwsh

  website-and-media:
    needs: [authorize, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-installers
          path: apps/website/public/downloads/v${{ needs.authorize.outputs.version }}/
      - run: npm ci --prefix apps/website
      - run: npm run build:native --prefix apps/website
      - run: npx --prefix apps/website playwright install --with-deps chromium
      - run: npm test --prefix apps/website
      - name: Build the deployable website with verified installers
        run: |
          npm run test:downloads --prefix apps/website
          npm run build --prefix apps/website
      - name: Refresh all six languages of screenshots, onboarding and recordings
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install Pillow
          HOST=127.0.0.1 PORT=4325 node apps/website/scripts/serve.mjs > "$RUNNER_TEMP/media-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4325/en/ > /dev/null; then break; fi
            sleep 1
          done
          node apps/website/scripts/readme-media.mjs
          python scripts/readme-gif.py
          python scripts/readme-build.py
      - name: Archive the website and companion materials
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          mkdir -p artifacts/release
          (cd apps/website/out && zip -qr "$GITHUB_WORKSPACE/artifacts/release/SnapSlot-$VERSION-website.zip" .)
          zip -qr "artifacts/release/SnapSlot-$VERSION-media.zip" README.md docs/readme docs/media
      - uses: actions/upload-artifact@v4
        with:
          name: release-website-and-media
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [authorize, package, verify-windows-installer, website-and-media]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-installers
          path: apps/website/public/downloads/v${{ needs.authorize.outputs.version }}/
      - uses: actions/download-artifact@v4
        with:
          name: release-website-and-media
          path: artifacts/release/
      - run: node scripts/verify-release.mjs
      - name: Create the tag and publish the exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: node scripts/publish-release.mjs
